[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speechrevolutions"
version = "0.2.0"
description = "Official Python SDK for the Speech Revolutions speech-to-text API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Speech Revolutions" }]
keywords = ["speech-to-text", "stt", "transcription", "whisper", "asr"]
dependencies = [
    "requests>=2.28",
    "httpx>=0.27",
]

[project.optional-dependencies]
progress = ["tqdm>=4.65"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "tqdm>=4.65"]

[project.urls]
Homepage = "https://speechrevolutions.com"
Documentation = "https://api.speechrevolutions.com"

[tool.setuptools.packages.find]
where = ["src"]
