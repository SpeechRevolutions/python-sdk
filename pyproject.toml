[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speechrevolutions"
version = "0.3.0"
description = "Official Python SDK for the Speech Revolutions speech-to-text API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Speech Revolutions" }]
keywords = ["speech-to-text", "stt", "transcription", "whisper", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "httpx>=0.27",
]

[project.optional-dependencies]
progress = ["tqdm>=4.65"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "tqdm>=4.65"]

[project.urls]
Homepage = "https://speechrevolutions.com"
Documentation = "https://docs.speechrevolutions.com"
Repository = "https://github.com/SpeechRevolutions/python-sdk"
Issues = "https://github.com/SpeechRevolutions/python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Without this marker the wheel ships no types, and every consumer of a fully
# annotated SDK gets `Any` back from their type checker. PEP 561.
[tool.setuptools.package-data]
speechrevolutions = ["py.typed"]
